services:
  # Production build served by angie
  app:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    restart: unless-stopped

  # Dev server with hot module replacement
  dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - NODE_ENV=development
